[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bpllm"
version = "0.1.0"
description = "BPLLM Framework Implementation"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas >2.0.0, <3.0.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "scipy>=1.10.0,<1.14.0",
    "langchain>=0.2.0,<0.3.0",
    "langchain-community>=0.2.0,<0.3.0",
    "langchain-core>=0.2.0,<0.3.0",
    "langchain-qdrant>=0.1.0,<0.2.0",
    "qdrant-client>=1.9.0,<1.12.0",
    "sentence-transformers>=2.7.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0", 
    "streamlit>=1.35.0,<1.40.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
# Chỉ cài trên Google Colab, không cài trên máy local (xem README)
finetune = [
    "peft>=0.11.0,<0.12.0",
    "trl>=0.9.0,<0.10.0",
    "bitsandbytes>=0.43.0,<0.44.0",
    "accelerate>=0.33.0,<0.34.0"
]
llm = [
    "openai>=1.30.0,<2.0.0"
]
dev = [
    "pytest>=8.0.0,<9.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
