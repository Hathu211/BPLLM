[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bpllm"
version = "2.0.0"
description = "BPLLM: trợ lý hỏi đáp quy trình nghiệp vụ dựa trên BPMN (RAG + Llama 3.1 8B fine-tune)"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "qdrant-client>=1.10.0,<1.12.0",
    "sentence-transformers>=2.7.0,<4.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.35.0,<1.40.0",
    # Streamlit dùng pyarrow cho st.dataframe; pyarrow >= 22 đòi NumPy 2, xung đột với numpy<2 ở trên
    "pyarrow>=14.0.0,<22.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
