name: bpllm2

services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: bpllm2-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6343}:6333"   # HTTP (dashboard: http://localhost:6343/dashboard)
      - "${QDRANT_GRPC_PORT:-6344}:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped
