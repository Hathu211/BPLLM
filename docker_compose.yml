version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: bpllm-qdrant
    ports:
      - "6333:6333" # Cổng HTTP REST API (Xem Web Dashboard)
      - "6334:6334" # Cổng gRPC API (Bắt buộc dùng cho BPLLM Framework)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always
